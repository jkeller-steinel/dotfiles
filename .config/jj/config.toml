"$schema" = "https://jj-vcs.github.io/jj/latest/config-schema.json"

[user]
name = "Jonas Richard Keller"
email = "jonas.keller@steinel.de"

[ui]
editor = "vim"
default-command = "log"
diff-editor = ":builtin"
show-cryptographic-signatures = true

[git]
# Prevent pushing work in progress, anything explicitly labeled "private" and megamerges
private-commits = "subject(glob-i:'wip:*') | subject(glob-i:'private:*') | subject(glob-i:'megamerge*')"

[revsets]
bookmark-advance-to = "@-"
git-sign-on-push = "~signed() & mine()"

[revset-aliases]
"immutable_heads()" = "builtin_immutable_heads() | remote_bookmarks(main|dev)"

[templates]
draft_commit_description = "builtin_draft_commit_description_with_diff"

[signing]
behavior = "drop"
backend = "ssh"
key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOR7mllTjC5CHTwReRUGJ5NSwlcdTGltAju8ByZEDyLV jonas.keller@steinel.de"

[signing.backends.ssh]
allowed-signers = "~/.ssh/allowed_signers"
