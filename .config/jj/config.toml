"$schema" = "https://jj-vcs.github.io/jj/latest/config-schema.json"

[user]
name = "Jonas Richard Keller"
email = "jonas.keller@steinel.de"

[ui]
editor = "vim"
default-command = "log"
diff-editor = ":builtin"

[revsets]
bookmark-advance-to = "@-"

[revset-aliases]
"immutable_heads()" = "builtin_immutable_heads() | remote_bookmarks(main|dev)"

[templates]
draft_commit_description = "builtin_draft_commit_description_with_diff"
